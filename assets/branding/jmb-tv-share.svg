<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">JMB TV — One hub for every signal</title><desc id="desc">Discover JMB TV, newspapers, radio and news at media.jmbhost.qzz.io.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#050b1d"/><stop offset=".55" stop-color="#07142d"/><stop offset="1" stop-color="#160b35"/></linearGradient>
 <linearGradient id="line" x1="60" y1="40" x2="1140" y2="590" gradientUnits="userSpaceOnUse"><stop stop-color="#20eaff"/><stop offset=".52" stop-color="#3379ff"/><stop offset="1" stop-color="#ad3cff"/></linearGradient>
