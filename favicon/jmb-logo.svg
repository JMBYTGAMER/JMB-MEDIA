<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">JMB MEDIA logo</title>
<desc id="desc">A premium dark media emblem with a glowing gradient JMB monogram and play signal.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202f4e"/><stop offset=".52" stop-color="#0b1020"/><stop offset="1" stop-color="#35101d"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9df4e7"/><stop offset=".48" stop-color="#8a9dff"/><stop offset="1" stop-color="#ff816f"/></linearGradient>
 <linearGradient id="type" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#baf8ef"/><stop offset="1" stop-color="#ff9b7b"/></linearGradient>
 <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#71e7d6"/><stop offset="1" stop-color="#ff795f"/></linearGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".48"/></filter>
</defs>
<rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>
<rect x="10" y="10" width="492" height="492" rx="114" fill="none" stroke="url(#edge)" stroke-opacity=".75" stroke-width="5"/>
<circle cx="256" cy="236" r="172" fill="none" stroke="#a5c7ef" stroke-opacity=".09" stroke-width="2"/>
<circle cx="256" cy="236" r="144" fill="none" stroke="url(#edge)" stroke-opacity=".24" stroke-width="3" stroke-dasharray="3 15"/>
<path d="M99 339 C153 391 354 405 414 329" fill="none" stroke="url(#edge)" stroke-width="8" stroke-linecap="round" opacity=".9"/>
<path d="M124 113h264a34 34 0 0 1 34 34v171a34 34 0 0 1-34 34H124a34 34 0 0 1-34-34V147a34 34 0 0 1 34-34Z" fill="#0a101c" stroke="#d6e4f4" stroke-opacity=".14" stroke-width="3" filter="url(#shadow)"/>
<path d="M90 164h332" stroke="url(#edge)" stroke-opacity=".6" stroke-width="4"/>
<text x="254" y="265" text-anchor="middle" font-family="Arial Black,Impact,Arial,sans-serif" font-size="126" font-weight="900" letter-spacing="-12" fill="#040812" stroke="#040812" stroke-width="18" paint-order="stroke" filter="url(#shadow)">JMB</text>
<text x="254" y="265" text-anchor="middle" font-family="Arial Black,Impact,Arial,sans-serif" font-size="126" font-weight="900" letter-spacing="-12" fill="url(#type)" stroke="#7d8ca8" stroke-width="3" paint-order="stroke fill">JMB</text>
<path d="M228 288h52" stroke="#fff" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/>
<path d="M238 300v23h-13l31 27 31-27h-13v-23" fill="url(#signal)" opacity=".95" filter="url(#glow)"/>
<text x="256" y="391" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="800" letter-spacing="9" fill="#f5f8ff">MEDIA</text>
<circle cx="393" cy="104" r="8" fill="#9df4e7" filter="url(#glow)"/>
</svg>